name: docifer-local

services:
  postgres:
    image: postgres:17
    container_name: docifer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docifer}
      POSTGRES_USER: ${POSTGRES_USER:-docifer_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docifer_password}
    ports:
      - "5432:5432"
    volumes:
      - docifer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docifer_user} -d ${POSTGRES_DB:-docifer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: docifer-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - docifer_qdrant_data:/qdrant/storage

volumes:
  docifer_postgres_data:
  docifer_qdrant_data:
